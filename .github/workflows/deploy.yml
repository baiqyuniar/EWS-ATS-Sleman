name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Update & Build EWS-ATS Sleman
        run: |
          set -e
          echo "=========================================="
          echo "🚀 Starting EWS-ATS Sleman Deployment"
          echo "=========================================="

          # Load NVM & Node environment jika server menggunakan NVM
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Masuk ke folder aplikasi
          cd ~/apps/EWS-ATS

          echo "📥 1. Pulling latest code from GitHub..."
          # Pastikan safe directory dan gunakan token GitHub Actions (bebas kendala SSH key)
          git config --global --add safe.directory /home/disdik/apps/EWS-ATS || true
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/baiqyuniar/EWS-ATS-Sleman.git
          # Bersihkan ref lama/bentrok jika ada agar fetch tidak error "reference already exists"
          git update-ref -d refs/remotes/origin/main 2>/dev/null || true
          git remote prune origin 2>/dev/null || true
          git fetch --prune origin main
          git reset --hard FETCH_HEAD

          echo "⚙️ 2. Building Backend (ews-backend)..."
          cd ews-backend
          npx prisma migrate deploy
          npm run build

          echo "🌱 2b. Seeding Puskesmas Data & Users..."
          npm run seed:puskesmas

          echo "🔄 3. Restarting Backend Service (PM2)..."
          pm2 restart ews_be

          echo "🎨 4. Building Frontend (ews-frontend)..."
          cd ../ews-frontend
          npm run build

          echo "🌐 5. Deploying Frontend to Web Server..."
          echo "Copying dist to /var/www/html/dist/..."

          # SECURITY: Mencegah kebocoran password di repositori publik/kolaborator.
          # Prioritas sumber password sudo:
          # 1. GitHub Repository Secret: SERVER_SUDO_PASS (paling direkomendasikan)
          # 2. Berkas kredensial lokal di server: ~/.deploy_sudo_pass (chmod 600)
          # 3. Sudo passwordless (NOPASSWD) jika sudah dikonfigurasi di /etc/sudoers.d/
          SUDO_PASS="${{ secrets.SERVER_SUDO_PASS }}"
          if [ -z "$SUDO_PASS" ] && [ -f "$HOME/.deploy_sudo_pass" ]; then
            SUDO_PASS=$(cat "$HOME/.deploy_sudo_pass" 2>/dev/null || true)
          fi

          run_sudo() {
            if [ -n "$SUDO_PASS" ]; then
              printf '%s\n' "$SUDO_PASS" | sudo -S "$@"
            else
              sudo -n "$@" || sudo "$@"
            fi
          }

          run_sudo mkdir -p /var/www/html/dist
          run_sudo cp -rf dist/* /var/www/html/dist/
          run_sudo cp -rf dist/* /var/www/html/ 2>/dev/null || true
          run_sudo chown -R www-data:www-data /var/www/html 2>/dev/null || true

          # 6. Restart Nginx Web Server
          echo "🔄 6. Restarting Web Server..."
          run_sudo systemctl restart nginx 2>/dev/null || true
          run_sudo systemctl reload apache2 2>/dev/null || true

          echo "=========================================="
          echo "✅ Deployment completed successfully!"
          echo "=========================================="
