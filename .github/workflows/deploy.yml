name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Update & Build EWS-ATS Sleman
        run: |
          set -e
          echo "=========================================="
          echo "🚀 Starting EWS-ATS Sleman Deployment"
          echo "=========================================="

          # Load NVM & Node environment jika server menggunakan NVM
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Masuk ke folder aplikasi
          cd ~/apps/EWS-ATS

          echo "📥 1. Pulling latest code from GitHub..."
          # Pastikan safe directory dan gunakan token GitHub Actions (bebas kendala SSH key)
          git config --global --add safe.directory /home/disdik/apps/EWS-ATS || true
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/baiqyuniar/EWS-ATS-Sleman.git
          git pull origin main

          echo "⚙️ 2. Building Backend (ews-backend)..."
          cd ews-backend
          npm run build

          echo "🔄 3. Restarting Backend Service (PM2)..."
          pm2 restart ews_be

          echo "🎨 4. Building Frontend (ews-frontend)..."
          cd ../ews-frontend
          npm run build

          echo "🌐 5. Deploying Frontend to Web Server..."
          echo "Copying dist to /var/www/html/dist/..."
          printf '%s\n' 'Lemb4yung!' | sudo -S mkdir -p /var/www/html/dist
          printf '%s\n' 'Lemb4yung!' | sudo -S cp -rf dist/* /var/www/html/dist/
          printf '%s\n' 'Lemb4yung!' | sudo -S cp -rf dist/* /var/www/html/ 2>/dev/null || true
          printf '%s\n' 'Lemb4yung!' | sudo -S chown -R www-data:www-data /var/www/html 2>/dev/null || true

          # 6. Restart Nginx Web Server
          echo "🔄 6. Restarting Web Server..."
          printf '%s\n' 'Lemb4yung!' | sudo -S systemctl restart nginx 2>/dev/null || true
          printf '%s\n' 'Lemb4yung!' | sudo -S systemctl reload apache2 2>/dev/null || true

          echo "=========================================="
          echo "✅ Deployment completed successfully!"
          echo "=========================================="
