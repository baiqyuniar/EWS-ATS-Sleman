name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Update & Build EWS-ATS Sleman
        run: |
          set -e
          echo "=========================================="
          echo "🚀 Starting EWS-ATS Sleman Deployment"
          echo "=========================================="

          # Load NVM & Node environment jika server menggunakan NVM
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          # Masuk ke folder aplikasi
          cd ~/apps/EWS-ATS

          echo "📥 1. Pulling latest code from GitHub..."
          # Pastikan safe directory dan gunakan token GitHub Actions (bebas kendala SSH key)
          git config --global --add safe.directory /home/disdik/apps/EWS-ATS || true
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/baiqyuniar/EWS-ATS-Sleman.git
          git pull origin main

          echo "⚙️ 2. Building Backend (ews-backend)..."
          cd ews-backend
          npm run build

          echo "🔄 3. Restarting Backend Service (PM2)..."
          pm2 restart ews_be

          echo "🎨 4. Building Frontend (ews-frontend)..."
          cd ../ews-frontend
          npm run build

          echo "🌐 5. Deploying Frontend to Web Server..."
          mkdir -p ~/apps/EWS-ATS/ews-backend/uploads
          INFO_FILE="$HOME/apps/EWS-ATS/ews-backend/uploads/deploy-info.txt"
          echo "=== DEPLOY DIAGNOSTIC ===" > "$INFO_FILE"
          echo "Date: $(date)" >> "$INFO_FILE"
          echo "User: $(whoami)" >> "$INFO_FILE"
          echo "PWD: $(pwd)" >> "$INFO_FILE"

          # 1. Cari lokasi aset yang sedang disajikan web server
          echo "--- SEARCHING FOR OLD ASSETS ---" >> "$INFO_FILE"
          OLD_ASSETS=$(find /var/www /home /srv -name "index-Bn-6mSgl.js" 2>/dev/null || true)
          echo "Old assets found: $OLD_ASSETS" >> "$INFO_FILE"

          # 2. Apache & Nginx vhost config
          echo "--- APACHE CONFIG ---" >> "$INFO_FILE"
          grep -rn "DocumentRoot" /etc/apache2/ 2>/dev/null >> "$INFO_FILE" || true
          echo "--- NGINX CONFIG ---" >> "$INFO_FILE"
          grep -rn "root " /etc/nginx/ 2>/dev/null >> "$INFO_FILE" || true

          # 3. Lakukan copy ke setiap lokasi webroot yang ditemukan
          for asset in $OLD_ASSETS; do
            ROOT_DIR=$(dirname $(dirname "$asset"))
            echo "Copying to $ROOT_DIR..." >> "$INFO_FILE"
            echo "Lemb4yung!" | sudo -S cp -rf dist/* "$ROOT_DIR/" 2>> "$INFO_FILE" || cp -rf dist/* "$ROOT_DIR/" 2>> "$INFO_FILE" || true
            echo "Lemb4yung!" | sudo -S chown -R www-data:www-data "$ROOT_DIR" 2>/dev/null || true
          done

          # Jika /var/www/html ada, selalu copy juga ke sana
          if [ -d "/var/www/html" ]; then
            echo "Copying to /var/www/html..." >> "$INFO_FILE"
            echo "Lemb4yung!" | sudo -S cp -rf dist/* /var/www/html/ 2>> "$INFO_FILE" || cp -rf dist/* /var/www/html/ 2>> "$INFO_FILE" || true
            echo "Lemb4yung!" | sudo -S chown -R www-data:www-data /var/www/html 2>/dev/null || true
          fi

          # Cek DocumentRoot dari Apache sites-enabled
          APACHE_DOCROOT=$(grep -rh "DocumentRoot" /etc/apache2/sites-enabled/ 2>/dev/null | awk '{print $2}' | tr -d '"' | head -n 1)
          if [ -n "$APACHE_DOCROOT" ] && [ -d "$APACHE_DOCROOT" ]; then
            echo "Copying to Apache DocumentRoot: $APACHE_DOCROOT..." >> "$INFO_FILE"
            echo "Lemb4yung!" | sudo -S cp -rf dist/* "$APACHE_DOCROOT/" 2>> "$INFO_FILE" || true
          fi

          # 4. Reload / Restart Web Server
          echo "--- RELOADING WEBSERVER ---" >> "$INFO_FILE"
          echo "Lemb4yung!" | sudo -S systemctl reload apache2 2>> "$INFO_FILE" || true
          echo "Lemb4yung!" | sudo -S systemctl reload nginx 2>> "$INFO_FILE" || true
          echo "Lemb4yung!" | sudo -S systemctl restart apache2 2>> "$INFO_FILE" || true
          echo "Deploy completed at $(date)" >> "$INFO_FILE"

          echo "=========================================="
          echo "✅ Deployment completed successfully!"
          echo "=========================================="
